StylesPath = styles
MinAlertLevel = error

[*.html]
BasedOnStyles = Equilens
TokenIgnores = (<code>[^<]*</code>), (<abbr[^>]*>), (v5\.0\.0[\w.-]*)

# Rendered body text produced by scripts/ops/normalize_html_text.py: entities
# decoded and markup stripped, so tripwires also fire on evasion variants.
[*.txt]
BasedOnStyles = Equilens
TokenIgnores = (v5\.0\.0[\w.-]*)

[*.md]
BasedOnStyles = Equilens
TokenIgnores = (v5\.0\.0[\w.-]*)
