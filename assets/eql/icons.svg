<svg xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
  <!-- Equilens icon sprite: 24px grid, stroke-width 2, round caps/joins
       (stroke styling comes from the .icon class in base.css).
       Reference: <svg class="icon"><use href="/assets/eql/icons.svg#icon-NAME"></use></svg>

       Concept map - one icon per concept, applied to feature cards only.
       Numbered flows use .badge-number; reader/download/legal cards carry
       no icon.
         icon-simulation : outcome simulation (refresh arrows)
         icon-evidence   : evidence packs / reports (document + check)
         icon-hosting    : customer-hosted / cloud + AMI paths (cloud)
         icon-docs       : documentation / business records (document + lines)
         icon-deploy     : container & VM deployment (layers)
         icon-contact    : contact / privacy inbox (chat bubble)
         icon-security   : security posture (shield; reserved, currently unused) -->
  <defs>
    <symbol id="icon-simulation" viewBox="0 0 24 24"><polyline points="23 4 23 10 17 10"/><polyline points="1 20 1 14 7 14"/><path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"/></symbol>
    <symbol id="icon-evidence" viewBox="0 0 24 24"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><path d="M9 15l2 2 4-4"/></symbol>
    <symbol id="icon-hosting" viewBox="0 0 24 24"><path d="M17.5 19H9a7 7 0 1 1 6.71-9h1.79a4.5 4.5 0 1 1 0 9Z"/></symbol>
    <symbol id="icon-docs" viewBox="0 0 24 24"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/><polyline points="10 9 9 9 8 9"/></symbol>
    <symbol id="icon-deploy" viewBox="0 0 24 24"><path d="m12 2 9 5-9 5-9-5 9-5"/><path d="m3 12 9 5 9-5"/><path d="m3 17 9 5 9-5"/></symbol>
    <symbol id="icon-contact" viewBox="0 0 24 24"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></symbol>
    <symbol id="icon-security" viewBox="0 0 24 24"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></symbol>
  </defs>
</svg>
