name: Site audits (links, a11y, Lighthouse)

on:
  pull_request:
  push:
    branches: [ main ]

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install npm dependencies
        run: npm ci --ignore-scripts

      - name: Footer metadata guard
        run: scripts/ops/check_footer_metadata.sh

      - name: Content lint (forbidden phrases)
        run: scripts/ops/content_lint.sh

      - name: HTML conformance (html-validate)
        run: npm run lint:html

      - name: Claims lint (Vale tripwires on deploy artifact + rendered text)
        run: |
          set -euo pipefail
          curl -sL -o /tmp/vale.tgz https://github.com/errata-ai/vale/releases/download/v3.7.1/vale_3.7.1_Linux_64-bit.tar.gz
          tar -xzf /tmp/vale.tgz -C /tmp vale
          # Authoritative scope: build the deploy artifact and lint every HTML
          # file in it, so lint scope cannot drift from what actually ships.
          bash scripts/deploy/prepare.sh
          mapfile -t DIST_HTML < <(find dist -type f -name '*.html' | sort)
          [ "${#DIST_HTML[@]}" -gt 0 ] || { echo "::error::no HTML files in dist"; exit 1; }
          /tmp/vale --config .vale.ini "${DIST_HTML[@]}"
          # Rendered-text pass: entities decoded, markup stripped, so evasion
          # variants (entity separators, markup splits) also trip the rules.
          python3 scripts/ops/normalize_html_text.py dist /tmp/normtext
          mapfile -t NORM_TXT < <(find /tmp/normtext -type f -name '*.txt' | sort)
          /tmp/vale --config .vale.ini "${NORM_TXT[@]}"
          # Liveness: every probe in both known-bad fixtures must fire,
          # individually, or the gate is considered dead.
          python3 scripts/ops/check_claims_gate.py /tmp/vale
          # dist must not leak into later steps (screenshots, link check).
          rm -rf dist

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Playwright suite (design system, content pins, axe WCAG 2.0/2.1/2.2 AA)
        run: npm test

      - name: Setup Python server
        run: |
          python3 -m pip install --upgrade pip
          nohup python3 -m http.server 8080 >/dev/null 2>&1 &
          sleep 1

      - name: Install Chrome (for screenshots)
        uses: browser-actions/setup-chrome@v1

      - name: Ensure evidence script permissions
        run: chmod +x scripts/evidence/screenshots.sh || true

      - name: Capture screenshots (evidence)
        run: scripts/evidence/screenshots.sh "SCREENSHOTS-AUDIT"

      - name: Link check (Lychee pinned)
        uses: lycheeverse/lychee-action@v2
        with:
          args: --config ops/lychee.toml .
          fail: true
          output: lychee/results.md

      - name: Install a11y & Lighthouse CLIs
        run: |
          npm i -g pa11y-ci@3.1.0 @lhci/cli@0.13.0

      - name: Accessibility (Pa11y CI)
        run: pa11y-ci --config ops/pa11yci.json

      - name: Verify LHCI config parity
        run: python3 scripts/ops/check_lhci_configs.py

      - name: Lighthouse CI (5 URLs)
        run: lhci autorun --config=ops/lighthouserc.ci.json

      - name: Upload audit artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: site-audits
          path: |
            ./.lighthouseci/**/*
            ./lychee/results.md
            ./output/ops/PLAYWRIGHT-AUDIT-*/report.json
            ./output/ops/PLAYWRIGHT-AUDIT-*/manifest.json
          if-no-files-found: error
          include-hidden-files: true

      - name: Upload screenshots artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: site-screenshots-from-audit
          path: output/ops/SCREENSHOTS-*/
