name: Site audits (links, a11y, Lighthouse)

on:
  pull_request:
  push:
    branches: [ main ]

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install npm dependencies
        run: npm ci --ignore-scripts

      - name: Footer metadata guard
        run: scripts/ops/check_footer_metadata.sh

      - name: Content lint (forbidden phrases)
        run: scripts/ops/content_lint.sh

      - name: HTML conformance on deploy artifact
        run: npm run lint:html

      - name: Install pinned Vale
        env:
          VALE_VERSION: '3.7.1'
          VALE_SHA256: 'ba4924bf2c5884499f09b02a6eb3318b29df40a3e81701c0804b9b1aefcd9483'
        run: |
          set -euo pipefail
          VALE_DIR="${RUNNER_TEMP}/vale"
          VALE_ARCHIVE="${RUNNER_TEMP}/vale_${VALE_VERSION}_Linux_64-bit.tar.gz"
          mkdir -p "${VALE_DIR}"
          curl --fail --silent --show-error --location \
            "https://github.com/vale-cli/vale/releases/download/v${VALE_VERSION}/vale_${VALE_VERSION}_Linux_64-bit.tar.gz" \
            --output "${VALE_ARCHIVE}"
          printf '%s  %s\n' "${VALE_SHA256}" "${VALE_ARCHIVE}" | sha256sum --check --strict
          tar -xzf "${VALE_ARCHIVE}" -C "${VALE_DIR}" vale
          printf '%s\n' "${VALE_DIR}" >> "${GITHUB_PATH}"

      - name: Claims tripwires on raw and rendered deploy text
        run: scripts/ops/run_vale_claims.sh vale

      - name: Playwright suite (content, design and axe WCAG checks)
        env:
          PLAYWRIGHT_AUDIT_TAG: PLAYWRIGHT-AUDIT
          PLAYWRIGHT_AUDIT_STAMP: gha-${{ github.run_id }}-${{ github.run_attempt }}
        run: npm test

      - name: Setup Python server
        run: |
          python3 -m pip install --upgrade pip
          nohup python3 -m http.server 8080 >/dev/null 2>&1 &
          sleep 1

      - name: Install Chrome (for screenshots)
        uses: browser-actions/setup-chrome@v1

      - name: Ensure evidence script permissions
        run: chmod +x scripts/evidence/screenshots.sh || true

      - name: Capture screenshots (evidence)
        run: scripts/evidence/screenshots.sh "SCREENSHOTS-AUDIT"

      - name: Prepare deploy artifact for link checking
        run: scripts/deploy/prepare.sh

      - name: Link check (Lychee pinned)
        uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2.9.0
        with:
          args: --config ops/lychee.toml --root-dir ${{ github.workspace }}/dist dist
          fail: true
          output: lychee-results.md

      - name: Install a11y & Lighthouse CLIs
        run: |
          npm i -g pa11y-ci@3.1.0 @lhci/cli@0.13.0

      - name: Accessibility (Pa11y CI)
        run: pa11y-ci --config ops/pa11yci.json

      - name: Verify LHCI config parity
        run: python3 scripts/ops/check_lhci_configs.py

      - name: Lighthouse CI (6 URLs)
        run: lhci autorun --config=ops/lighthouserc.ci.json

      - name: Upload audit artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: site-audits
          path: |
            ./.lighthouseci/**/*
            ./lychee-results.md
            ./output/ops/PLAYWRIGHT-AUDIT-gha-${{ github.run_id }}-${{ github.run_attempt }}/**/*
          if-no-files-found: error
          include-hidden-files: true

      - name: Upload screenshots artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: site-screenshots-from-audit
          path: output/ops/SCREENSHOTS-*/
