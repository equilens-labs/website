name: Site audits (links, a11y, Lighthouse)

on:
  pull_request:
  push:
    branches: [ main ]

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20.11.1'

      - name: Install npm dependencies
        run: npm ci --ignore-scripts

      - name: Footer metadata guard
        run: scripts/ops/check_footer_metadata.sh

      - name: Content lint (forbidden phrases)
        run: scripts/ops/content_lint.sh

      - name: HTML conformance (html-validate)
        run: npm run lint:html

      - name: Claims lint (Vale, manifest-scoped + liveness fixture)
        run: |
          set -euo pipefail
          curl -sL -o /tmp/vale.tgz https://github.com/errata-ai/vale/releases/download/v3.7.1/vale_3.7.1_Linux_64-bit.tar.gz
          tar -xzf /tmp/vale.tgz -C /tmp vale
          mapfile -t SURFACES < <(grep -vE '^\s*(#|$)' config/deploy/surfaces.txt)
          # Drift guard: every lint surface must also be in the deploy allowlist.
          for s in "${SURFACES[@]}"; do
            grep -qF "\"${s%.html}\"" scripts/deploy/prepare.sh || grep -qF "\"$s\"" scripts/deploy/prepare.sh || {
              echo "::error::'$s' is in config/deploy/surfaces.txt but not in scripts/deploy/prepare.sh"; exit 1; }
          done
          # Deployed surfaces must be clean.
          /tmp/vale --config .vale.ini "${SURFACES[@]}"
          # Known-bad fixture must fire, or the gate is dead.
          if /tmp/vale --config .vale.ini --output=line tests/fixtures/claims-known-bad.md > /tmp/vale-fixture.out 2>&1; then
            echo "::error::claims gate reported no errors on the known-bad fixture"
            cat /tmp/vale-fixture.out; exit 1
          fi
          HITS=$(wc -l < /tmp/vale-fixture.out)
          if [ "$HITS" -lt 13 ]; then
            echo "::error::claims gate fired only $HITS times on the known-bad fixture (expected >= 13)"
            cat /tmp/vale-fixture.out; exit 1
          fi
          echo "Claims gate alive: $HITS hits on the known-bad fixture"

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Playwright suite (design system, content pins, axe WCAG 2.0/2.1/2.2 AA)
        run: npm test

      - name: Setup Python server
        run: |
          python3 -m pip install --upgrade pip
          nohup python3 -m http.server 8080 >/dev/null 2>&1 &
          sleep 1

      - name: Install Chrome (for screenshots)
        uses: browser-actions/setup-chrome@v1

      - name: Ensure evidence script permissions
        run: chmod +x scripts/evidence/screenshots.sh || true

      - name: Capture screenshots (evidence)
        run: scripts/evidence/screenshots.sh "SCREENSHOTS-AUDIT"

      - name: Link check (Lychee pinned)
        uses: lycheeverse/lychee-action@v2
        with:
          args: --config ops/lychee.toml .
          fail: true
          output: lychee/results.md

      - name: Install a11y & Lighthouse CLIs
        run: |
          npm i -g pa11y-ci@3.1.0 @lhci/cli@0.13.0

      - name: Accessibility (Pa11y CI)
        run: pa11y-ci --config ops/pa11yci.json

      - name: Verify LHCI config parity
        run: python3 scripts/ops/check_lhci_configs.py

      - name: Lighthouse CI (5 URLs)
        run: lhci autorun --config=ops/lighthouserc.ci.json

      - name: Upload audit artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: site-audits
          path: |
            ./.lighthouseci/**/*
            ./lychee/results.md
            ./output/ops/PLAYWRIGHT-AUDIT-*/report.json
            ./output/ops/PLAYWRIGHT-AUDIT-*/manifest.json
          if-no-files-found: error
          include-hidden-files: true

      - name: Upload screenshots artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: site-screenshots-from-audit
          path: output/ops/SCREENSHOTS-*/
