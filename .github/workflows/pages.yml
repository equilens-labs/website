name: Deploy website to GitHub Pages

on:
  # Deploys are gated on the audit workflow: this fires only when
  # "Site audits" completes on main, and the build job requires success.
  workflow_run:
    workflows: ["Site audits (links, a11y, Lighthouse)"]
    types: [completed]
    branches: [ main ]
  workflow_dispatch:
    inputs:
      visibility:
        description: 'Site visibility (private keeps noindex & Disallow; public adds sitemap & allows indexing)'
        required: true
        default: 'private'
        type: choice
        options: [ 'private', 'public' ]

permissions:
  contents: write
  actions: read
  pages: write
  id-token: write

# Only trusted events share the deployment queue (and may cancel a queued
# deploy): manual dispatch, or a successful same-repository push audit. Any
# other trigger (e.g. a fork PR whose branch is named "main" reaching
# workflow_run) gets a run-unique group so it can never cancel a legitimate
# deployment; the guard job then rejects it.
concurrency:
  group: ${{ (github.event_name == 'workflow_dispatch' || (github.event.workflow_run.event == 'push' && github.event.workflow_run.head_repository.full_name == github.repository && github.event.workflow_run.conclusion == 'success')) && 'pages' || format('pages-rejected-{0}', github.run_id) }}
  cancel-in-progress: true

env:
  # Default flipped to 'public' on 2026-06-10 (indexing unblock): pushes to main now deploy
  # publicly. A manual workflow_dispatch with visibility=private remains available to re-hide.
  SITE_VISIBILITY: ${{ github.event_name == 'workflow_dispatch' && inputs.visibility || 'public' }}

jobs:
  # Deploy provenance guard: only same-repo pushes to main that passed the
  # audit may deploy, and only while the audited SHA is still main's tip
  # (a superseded SHA skips; its successor's own audit will deploy it).
  guard:
    runs-on: ubuntu-latest
    outputs:
      proceed: ${{ steps.decide.outputs.proceed }}
      deploy_sha: ${{ steps.decide.outputs.deploy_sha }}
    steps:
      - name: Decide whether this event may deploy
        id: decide
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
          RUN_CONCLUSION: ${{ github.event.workflow_run.conclusion }}
          RUN_EVENT: ${{ github.event.workflow_run.event }}
          RUN_HEAD_REPO: ${{ github.event.workflow_run.head_repository.full_name }}
          RUN_HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            # Break-glass path: deliberately bypasses the audit gate, but only
            # ever deploys the current tip of main (never the selected ref).
            MAIN_SHA=$(gh api "repos/${GITHUB_REPOSITORY}/branches/main" --jq .commit.sha)
            echo "Break-glass manual dispatch: deploying main tip ${MAIN_SHA} without waiting for an audit."
            echo "proceed=true" >> "$GITHUB_OUTPUT"
            echo "deploy_sha=${MAIN_SHA}" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ "$RUN_CONCLUSION" != "success" ]; then
            echo "Audit run did not succeed ($RUN_CONCLUSION); not deploying."
            echo "proceed=false" >> "$GITHUB_OUTPUT"; exit 0
          fi
          if [ "$RUN_EVENT" != "push" ]; then
            echo "Audit was for a $RUN_EVENT event, not a push to main; not deploying."
            echo "proceed=false" >> "$GITHUB_OUTPUT"; exit 0
          fi
          if [ "$RUN_HEAD_REPO" != "$GITHUB_REPOSITORY" ]; then
            echo "Audit head repository $RUN_HEAD_REPO is not $GITHUB_REPOSITORY; not deploying."
            echo "proceed=false" >> "$GITHUB_OUTPUT"; exit 0
          fi
          MAIN_SHA=$(gh api "repos/${GITHUB_REPOSITORY}/branches/main" --jq .commit.sha)
          if [ "$RUN_HEAD_SHA" != "$MAIN_SHA" ]; then
            echo "Audited SHA $RUN_HEAD_SHA is no longer main tip ($MAIN_SHA); skipping (newer audit will deploy)."
            echo "proceed=false" >> "$GITHUB_OUTPUT"; exit 0
          fi
          echo "Deploying audited SHA $RUN_HEAD_SHA (current main tip)."
          echo "proceed=true" >> "$GITHUB_OUTPUT"
          echo "deploy_sha=$RUN_HEAD_SHA" >> "$GITHUB_OUTPUT"

  build:
    needs: guard
    if: needs.guard.outputs.proceed == 'true'
    runs-on: ubuntu-latest
    outputs:
      mode: ${{ steps.pages_mode.outputs.mode }}
    steps:
      - name: Checkout pinned deploy SHA
        uses: actions/checkout@v4
        with:
          # Always the SHA the guard resolved: the audited commit for
          # workflow_run, main's tip for break-glass dispatch. Never the
          # dispatcher-selected ref.
          ref: ${{ needs.guard.outputs.deploy_sha }}

      - name: CI context debug (early)
        continue-on-error: true
        run: |
          mkdir -p ci-debug
          echo "GITHUB_REF=$GITHUB_REF" > ci-debug/context.txt
          echo "GITHUB_SHA=$GITHUB_SHA" >> ci-debug/context.txt
          echo "GITHUB_EVENT_NAME=$GITHUB_EVENT_NAME" >> ci-debug/context.txt
          echo "Actor=$GITHUB_ACTOR" >> ci-debug/context.txt
          echo "Runner OS=$RUNNER_OS" >> ci-debug/context.txt
          echo "Repo=$GITHUB_REPOSITORY" >> ci-debug/context.txt
      - name: Upload CI debug (early)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ci-debug-early
          path: ci-debug

      - name: Detect Pages mode (Actions vs branch)
        id: pages_mode
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          mkdir -p ci-debug
          RESP=$(curl -fsS -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/pages" || true)
          printf "%s" "$RESP" > ci-debug/pages.json || true
          MODE="unknown"
          if echo "$RESP" | grep -q '"source"'; then
            if echo "$RESP" | grep -q '"branch"[[:space:]]*:[[:space:]]*"gh-pages"'; then
              MODE="branch"
            else
              MODE="actions"
            fi
          fi
          echo "Detected Pages mode: $MODE"
          echo "mode=$MODE" >> "$GITHUB_OUTPUT"

      - name: Setup Python for tooling
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install OG renderer
        run: |
          python -m pip install --upgrade pip
          pip install cairosvg

      - name: Ensure script permissions
        run: |
          chmod +x scripts/seo/toggle-robots.sh scripts/og/render.sh scripts/evidence/snapshot.sh scripts/ops/guard_dns_ssl.sh scripts/ops/check_footer_metadata.sh || true

      - name: Footer metadata guard
        run: scripts/ops/check_footer_metadata.sh

      - name: Set site visibility (private/public)
        run: |
          echo "SITE_VISIBILITY=${SITE_VISIBILITY}"
          python3 scripts/seo/set-indexing.py "${SITE_VISIBILITY}"
          scripts/seo/toggle-robots.sh "${SITE_VISIBILITY}"

      - name: Generate sitemap (public only)
        if: env.SITE_VISIBILITY == 'public'
        run: python3 scripts/seo/gen-sitemap.py

      - name: Render OpenGraph PNG from SVG
        run: scripts/og/render.sh

      # Removed 2026-06-10: the "Render Whitepaper PDF" step printed the whitepaper page HTML to
      # an unlinked PDF at a guessable URL. The canonical whitepaper PDF ships from the pinned
      # public release; the on-site page at /fl-bsa/whitepaper/ links it directly.

      - name: Prepare deploy artifact
        run: |
          chmod +x scripts/deploy/prepare.sh
          scripts/deploy/prepare.sh

      - name: Debug dist tree
        run: |
          echo "Working dir: $(pwd)"
          du -sh dist || true
          echo "Sample dist file list:" && find dist -maxdepth 3 -type f | sort | sed -n '1,200p'
          echo "Whitepaper PDF (if present):" && ls -lh dist/fl-bsa/whitepaper/*.pdf 2>/dev/null || true

      - name: Upload dist debug artifact
        uses: actions/upload-artifact@v4
        with:
          name: dist-debug
          path: dist
          include-hidden-files: true

      - name: Guard no vendor demo pages
        run: |
          set -e
          MAP=$(find dist -type f -name '*.html' -print0 | xargs -0 -I{} sh -c "grep -nE '(^|/)(themes/appline/.*\\.html|template/appline-.*\\.html)' '{}' || true")
          if [ -n "$MAP" ]; then
            echo "::error file=dist::Vendor HTML detected in deploy artifact"
            echo "$MAP"
            exit 1
          fi

      - name: Guard DNS/TLS for custom domain
        run: |
          if [ -f CNAME ]; then
            DOMAIN=$(cat CNAME | tr -d '\n' | tr -d '\r')
            echo "Checking DNS/TLS for $DOMAIN and www.$DOMAIN"
            scripts/ops/guard_dns_ssl.sh "$DOMAIN" "www.$DOMAIN"
          else
            echo "No CNAME present; skipping DNS/TLS guard"
          fi

      - name: Evidence snapshot
        run: scripts/evidence/snapshot.sh "SITE-DEPLOY"

      - name: Configure Pages
        if: steps.pages_mode.outputs.mode != 'branch'
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload artifact
        if: steps.pages_mode.outputs.mode != 'branch'
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    if: needs.build.outputs.mode != 'branch'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  publish_gh_pages:
    name: Publish to gh-pages (branch mode)
    if: needs.build.outputs.mode == 'branch'
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Download dist artifact from build job
        uses: actions/download-artifact@v4
        with:
          name: dist-debug
          path: dist
      - name: Publish to gh-pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: dist
          publish_branch: gh-pages
          keep_files: false
